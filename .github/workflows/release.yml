name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, for example v1.2.3'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SOURCE_OVERLAY_REF: 5108c871e313912129c6f89353a424f8aacad290
  DOCLOUPE_SOURCE_SHA: 5108c871e313912129c6f89353a424f8aacad290

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Checkout source overlay
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ env.SOURCE_OVERLAY_REF }}
          path: source-overlay

      - name: Apply source overlay
        shell: pwsh
        run: Copy-Item -Recurse -Force source-overlay/servers/* servers/

      - name: Validate source overlay
        shell: pwsh
        run: |
          $required = @(
            'servers/excel/excel_converter.py',
            'servers/pdf/converter.py',
            'servers/docx/converter.py',
            'servers/docx/markdownify_helper.py',
            'servers/docx/converter_utils',
            'servers/pptx/converter.py',
            'servers/pptx/markdownify_helper.py',
            'servers/csv/converter.py',
            'servers/html/converter.py',
            'servers/html/markdownify_helper.py',
            'servers/text/converter.py',
            'servers/json/converter.py'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count) { throw "Source overlay is incomplete: $($missing -join ', ')" }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate release metadata
        run: node scripts/validate-release-metadata.mjs "${{ env.RELEASE_TAG }}"

      - name: Validate release flow
        run: node scripts/validate-release-flow.mjs

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv-build
          ./.venv-build/Scripts/python.exe -m pip install "pip==26.1.2" "setuptools==83.0.0"
          ./.venv-build/Scripts/python.exe -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe -m pytest -q

      - name: Check npm launcher
        working-directory: packages/npm
        run: npm test

  build:
    name: Build ${{ matrix.platform }} executables
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-14
            platform: macos-arm64

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Checkout source overlay
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ env.SOURCE_OVERLAY_REF }}
          path: source-overlay

      - name: Apply source overlay
        shell: pwsh
        run: Copy-Item -Recurse -Force source-overlay/servers/* servers/

      - name: Validate source overlay
        shell: pwsh
        run: |
          $required = @(
            'servers/excel/excel_converter.py',
            'servers/pdf/converter.py',
            'servers/docx/converter.py',
            'servers/docx/markdownify_helper.py',
            'servers/docx/converter_utils',
            'servers/pptx/converter.py',
            'servers/pptx/markdownify_helper.py',
            'servers/csv/converter.py',
            'servers/html/converter.py',
            'servers/html/markdownify_helper.py',
            'servers/text/converter.py',
            'servers/json/converter.py'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count) { throw "Source overlay is incomplete: $($missing -join ', ')" }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv-build
          $py = if (Test-Path ".venv-build/Scripts/python.exe") { ".venv-build/Scripts/python.exe" } else { ".venv-build/bin/python" }
          & $py -m pip install "pip==26.1.2" "setuptools==83.0.0"
          & $py -m pip install -r requirements-build.txt

      - name: Build all servers
        shell: pwsh
        run: |
          $py = if (Test-Path ".venv-build/Scripts/python.exe") { ".venv-build/Scripts/python.exe" } else { ".venv-build/bin/python" }
          $servers = @(
            @{ name = "excel-tools"; entry = "servers/excel/main.py"; paths = @("servers/excel", "servers"); hidden = @("excel_converter"); excludes = @("numpy", "lxml") },
            @{ name = "pdf-tools";   entry = "servers/pdf/main.py";   paths = @("servers/pdf"); hidden = @("converter") },
            @{ name = "docx-tools";  entry = "servers/docx/main.py";  paths = @("servers/docx"); hidden = @("converter") },
            @{ name = "pptx-tools";  entry = "servers/pptx/main.py";  paths = @("servers/pptx"); hidden = @("converter") },
            @{ name = "csv-tools";   entry = "servers/csv/main.py";   paths = @("servers/csv"); hidden = @("converter") },
            @{ name = "html-tools";  entry = "servers/html/main.py";  paths = @("servers/html"); hidden = @("converter") },
            @{ name = "md-tools";    entry = "servers/md/main.py";    paths = @("servers/md", "servers") },
            @{ name = "text-tools";  entry = "servers/text/main.py";  paths = @("servers/text"); hidden = @("converter") },
            @{ name = "json-tools";  entry = "servers/json/main.py";  paths = @("servers/json"); hidden = @("converter") }
          )
          foreach ($server in $servers) {
            $args = @("-m", "PyInstaller", "--clean", "--onefile", "--name", $server.name, "--specpath", "build", "--workpath", "build", "--distpath", "dist")
            foreach ($serverPath in @($server.paths)) { $args += @("--paths", $serverPath) }
            if ($server.ContainsKey("hidden")) {
              foreach ($hidden in $server.hidden) { $args += @("--hidden-import", $hidden) }
            }
            if ($server.ContainsKey("excludes")) {
              foreach ($exclude in $server.excludes) { $args += @("--exclude-module", $exclude) }
            }
            if ($server.name -eq "excel-tools") {
              $metadataPath = Join-Path (Get-Location) "build/excel-build-metadata.json"
              $serverVersion = (Get-Content server.json -Raw | ConvertFrom-Json).version
              $commitSha = (& git rev-parse HEAD | Select-Object -First 1)
              $statusOutput = @(& git status --porcelain)
              $libraryVersions = & $py -c "import importlib.metadata as m,json; print(json.dumps({'openpyxl':m.version('openpyxl'),'mcp':m.version('mcp')}))"
              if ($LASTEXITCODE -ne 0) { throw "Unable to read embedded library versions." }
              $metadata = [ordered]@{
                schema_version = 1
                server_version = $serverVersion
                commit_sha = $commitSha
                source_overlay_sha = $env:DOCLOUPE_SOURCE_SHA
                working_tree_dirty = [bool]($statusOutput -join "")
                library_versions = ($libraryVersions | ConvertFrom-Json)
              }
              New-Item -ItemType Directory -Force (Split-Path $metadataPath) | Out-Null
              $metadata | ConvertTo-Json -Depth 4 | Set-Content -Path $metadataPath -Encoding utf8NoBOM
              $args += @("--add-data", "$metadataPath$([IO.Path]::PathSeparator).")
              $args += @("--copy-metadata", "openpyxl", "--copy-metadata", "mcp")
            }
            $args += $server.entry
            & $py @args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $suffix = if ($platform.StartsWith('windows-')) { '.exe' } else { '' }
          $out = Join-Path 'artifacts' $platform
          New-Item -ItemType Directory -Force $out | Out-Null
          $servers = @('excel-tools','pdf-tools','docx-tools','pptx-tools','csv-tools','html-tools','md-tools','text-tools','json-tools')
          foreach ($server in $servers) {
            $src = Join-Path 'dist' "$server$suffix"
            $dst = Join-Path $out "docloupe-mcp-$server-$platform$suffix"
            Copy-Item $src $dst
          }
          Get-ChildItem $out | Where-Object { -not $_.Name.EndsWith('sha256sums.txt') } | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content (Join-Path $out "docloupe-mcp-$env:RELEASE_TAG-$platform-sha256sums.txt")

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docloupe-mcp-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          TAG="${RELEASE_TAG}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$TAG" | head -80)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}" | head -80)
          fi
          {
            echo "notes<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            # DocLoupe MCP ${{ env.RELEASE_TAG }}

            Local-first MCP servers for reading, converting, and editing document formats.

            ## What's Changed

            ${{ steps.changelog.outputs.notes }}

            ## Native Artifacts

            This release includes all server executables for:

            - `windows-x64` (`*.exe`)
            - `linux-x64`
            - `macos-x64`
            - `macos-arm64`

            Each platform has `docloupe-mcp-<server>-<platform>` binaries and a matching `docloupe-mcp-${{ env.RELEASE_TAG }}-<platform>-sha256sums.txt` checksum file.
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

  publish:
    name: Publish npm package
    needs: release
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      publish_npm: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
      publish_registry: false
    secrets: inherit
