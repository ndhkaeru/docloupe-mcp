name: Publish npm package

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to package, for example v1.2.3
        required: true
        type: string
      publish_npm:
        description: Publish package to npm
        required: false
        default: true
        type: boolean
      publish_registry:
        description: Also publish server.json to the MCP Registry
        required: false
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to package, for example v1.2.3'
        required: true
        type: string
      publish_npm:
        description: Publish package to npm
        required: false
        default: true
        type: boolean
      publish_registry:
        description: Also publish server.json to the MCP Registry
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      PUBLISH_NPM: ${{ inputs.publish_npm }}
      PUBLISH_REGISTRY: ${{ inputs.publish_registry }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Validate release metadata
        run: node scripts/validate-release-metadata.mjs "${RELEASE_TAG}"

      - name: Validate release flow
        run: node scripts/validate-release-flow.mjs

      - name: Check JavaScript
        working-directory: packages/npm
        run: npm test

      - name: Wait for release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          required=(
            docloupe-mcp-excel-tools-windows-x64.exe docloupe-mcp-md-tools-windows-x64.exe docloupe-mcp-pdf-tools-windows-x64.exe docloupe-mcp-docx-tools-windows-x64.exe docloupe-mcp-pptx-tools-windows-x64.exe docloupe-mcp-csv-tools-windows-x64.exe docloupe-mcp-html-tools-windows-x64.exe docloupe-mcp-text-tools-windows-x64.exe docloupe-mcp-json-tools-windows-x64.exe
            docloupe-mcp-excel-tools-linux-x64 docloupe-mcp-md-tools-linux-x64 docloupe-mcp-pdf-tools-linux-x64 docloupe-mcp-docx-tools-linux-x64 docloupe-mcp-pptx-tools-linux-x64 docloupe-mcp-csv-tools-linux-x64 docloupe-mcp-html-tools-linux-x64 docloupe-mcp-text-tools-linux-x64 docloupe-mcp-json-tools-linux-x64
            docloupe-mcp-excel-tools-macos-x64 docloupe-mcp-md-tools-macos-x64 docloupe-mcp-pdf-tools-macos-x64 docloupe-mcp-docx-tools-macos-x64 docloupe-mcp-pptx-tools-macos-x64 docloupe-mcp-csv-tools-macos-x64 docloupe-mcp-html-tools-macos-x64 docloupe-mcp-text-tools-macos-x64 docloupe-mcp-json-tools-macos-x64
            docloupe-mcp-excel-tools-macos-arm64 docloupe-mcp-md-tools-macos-arm64 docloupe-mcp-pdf-tools-macos-arm64 docloupe-mcp-docx-tools-macos-arm64 docloupe-mcp-pptx-tools-macos-arm64 docloupe-mcp-csv-tools-macos-arm64 docloupe-mcp-html-tools-macos-arm64 docloupe-mcp-text-tools-macos-arm64 docloupe-mcp-json-tools-macos-arm64
          )
          for i in {1..45}; do
            assets=$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')
            missing=0
            for item in "${required[@]}"; do
              if ! grep -qx "$item" <<<"$assets"; then missing=1; break; fi
            done
            if [ "$missing" -eq 0 ]; then exit 0; fi
            sleep 20
          done
          echo "Timed out waiting for all release assets for ${RELEASE_TAG}" >&2
          exit 1

      - name: Dry-run npm pack
        working-directory: packages/npm
        run: npm pack --dry-run

      - name: Check npm package availability
        id: npm_status
        if: env.PUBLISH_NPM == 'true'
        shell: bash
        run: |
          if npm view @ndhkaeru/docloupe-mcp@${RELEASE_TAG#v} version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: env.PUBLISH_NPM == 'true' && steps.npm_status.outputs.exists != 'true' && env.HAS_NPM_TOKEN == 'true'
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          output=$(npm publish --access public 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then exit 0; fi
          if grep -q 'Cannot publish over previously published version' <<<"$output"; then exit 0; fi
          exit "$status"

      - name: Skip existing npm package
        if: env.PUBLISH_NPM == 'true' && steps.npm_status.outputs.exists == 'true'
        run: echo '@ndhkaeru/docloupe-mcp@${{ env.RELEASE_TAG }} is already published; skipping npm publish.'

      - name: Fail without npm token
        if: env.PUBLISH_NPM == 'true' && steps.npm_status.outputs.exists != 'true' && env.HAS_NPM_TOKEN != 'true'
        run: |
          echo 'NPM_TOKEN is not configured; cannot publish @ndhkaeru/docloupe-mcp.' >&2
          exit 1

      - name: Verify public npm package
        if: env.PUBLISH_NPM == 'true'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in {1..30}; do
            published=$(npm view "@ndhkaeru/docloupe-mcp@${version}" version 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              temp_dir=$(mktemp -d)
              trap 'rm -rf "$temp_dir"' EXIT
              tarball=$(cd "$temp_dir" && npm pack "@ndhkaeru/docloupe-mcp@${version}" --silent)
              tar -xzf "$temp_dir/$tarball" -C "$temp_dir"
              PACKAGE_VERSION="$version" PACKAGE_DIR="$temp_dir/package" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const packageDir = process.env.PACKAGE_DIR;
          const expectedVersion = process.env.PACKAGE_VERSION;
          const metadata = JSON.parse(fs.readFileSync(path.join(packageDir, 'package.json'), 'utf8'));
          const expectedBins = [
            'docloupe-mcp',
            'docloupe-excel-tools',
            'docloupe-md-tools',
            'docloupe-pdf-tools',
            'docloupe-docx-tools',
            'docloupe-pptx-tools',
            'docloupe-csv-tools',
            'docloupe-html-tools',
            'docloupe-text-tools',
            'docloupe-json-tools',
          ];
          if (metadata.version !== expectedVersion) {
            throw new Error(`public package version ${metadata.version} != ${expectedVersion}`);
          }
          for (const bin of expectedBins) {
            const relativePath = metadata.bin?.[bin];
            if (!relativePath || !fs.existsSync(path.join(packageDir, relativePath))) {
              throw new Error(`public package is missing executable ${bin}`);
            }
          }
          NODE
              exit 0
            fi
            sleep 10
          done
          echo "npm package @ndhkaeru/docloupe-mcp@${version} did not become publicly readable." >&2
          exit 1

      - name: Skip npm publish for prerelease
        if: env.PUBLISH_NPM != 'true'
        run: echo 'Package validation completed; npm publish was skipped.'

      - name: Install MCP publisher
        if: env.PUBLISH_REGISTRY == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.1.0/mcp-publisher_1.1.0_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Publish MCP Registry metadata
        if: env.PUBLISH_REGISTRY == 'true'
        run: ./mcp-publisher publish
