name: Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_OVERLAY_REF: 80abc9c1e4c94c854ef4cf46797bcb16405b660c
  DOCLOUPE_SOURCE_SHA: 80abc9c1e4c94c854ef4cf46797bcb16405b660c

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      HAS_SOURCE_OVERLAY: ${{ secrets.SOURCE_REPO != '' && secrets.SOURCE_REPO_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-14
            platform: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout source overlay
        if: env.HAS_SOURCE_OVERLAY == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ env.SOURCE_OVERLAY_REF }}
          path: source-overlay

      - name: Apply source overlay
        if: env.HAS_SOURCE_OVERLAY == 'true'
        shell: pwsh
        run: |
          $required = @(
            'servers/excel/excel_converter.py', 'servers/pdf/converter.py',
            'servers/docx/converter.py', 'servers/docx/markdownify_helper.py',
            'servers/docx/converter_utils', 'servers/pptx/converter.py',
            'servers/pptx/markdownify_helper.py', 'servers/csv/converter.py',
            'servers/html/converter.py', 'servers/html/markdownify_helper.py',
            'servers/text/converter.py', 'servers/json/converter.py'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath (Join-Path 'source-overlay' $_)) })
          if ($missing.Count) { throw "Source overlay is incomplete: $($missing -join ', ')" }
          foreach ($path in $required) {
            New-Item -ItemType Directory -Force (Split-Path $path) | Out-Null
            Copy-Item -LiteralPath (Join-Path 'source-overlay' $path) -Destination $path -Recurse -Force
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate release flow
        run: node scripts/validate-release-flow.mjs

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv-build
          $py = if (Test-Path ".venv-build/Scripts/python.exe") { ".venv-build/Scripts/python.exe" } else { ".venv-build/bin/python" }
          & $py -m pip install "pip==26.1.2" "setuptools==83.0.0"
          & $py -m pip install -r requirements-build.txt

      - name: Compile server entrypoints
        shell: pwsh
        run: |
          $py = if (Test-Path ".venv-build/Scripts/python.exe") { ".venv-build/Scripts/python.exe" } else { ".venv-build/bin/python" }
          $entries = Get-ChildItem servers -Recurse -Filter main.py | ForEach-Object { $_.FullName }
          & $py -m py_compile @entries

      - name: Build portable diagram renderer
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path servers/md/diagram_renderer/Cargo.toml --target-dir build/diagram-target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        shell: pwsh
        run: |
          $py = if (Test-Path ".venv-build/Scripts/python.exe") { ".venv-build/Scripts/python.exe" } else { ".venv-build/bin/python" }
          & $py -m pytest -q

      - name: Check npm launcher
        working-directory: packages/npm
        run: npm test

      - name: Build smoke test (text-tools)
        if: env.HAS_SOURCE_OVERLAY == 'true'
        shell: pwsh
        run: |
          $py = if (Test-Path ".venv-build/Scripts/python.exe") { ".venv-build/Scripts/python.exe" } else { ".venv-build/bin/python" }
          & $py -m PyInstaller --clean --onefile --name text-tools --paths servers/text --hidden-import converter --specpath build --workpath build --distpath dist servers/text/main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
